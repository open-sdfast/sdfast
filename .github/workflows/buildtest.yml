name: BUILD_TEST

on:
  push:
  pull_request:

jobs:
  build:
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install Dependencies

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gfortran

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc

      - name: Install dependencies (Windows - MinGW)
        if: runner.os == 'Windows'
        run: |
          choco install mingw -y
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      # Configure

      - name: Configure
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release \
              -DSDFAST_WARNINGS_AS_ERRORS=ON

          elif [ "$RUNNER_OS" = "macOS" ]; then
            GCC_PREFIX=$(brew --prefix gcc)

            C_COMPILER=$(ls $GCC_PREFIX/bin/gcc-* | head -n1)
            CXX_COMPILER=$(ls $GCC_PREFIX/bin/g++-* | head -n1)
            FC_COMPILER=$(ls $GCC_PREFIX/bin/gfortran-* | head -n1)

            cmake -S . -B build \
              -DCMAKE_C_COMPILER=$C_COMPILER \
              -DCMAKE_CXX_COMPILER=$CXX_COMPILER \
              -DCMAKE_Fortran_COMPILER=$FC_COMPILER \
              -DCMAKE_BUILD_TYPE=Release \
              -DSDFAST_WARNINGS_AS_ERRORS=ON

          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DSDFAST_WARNINGS_AS_ERRORS=ON
          fi

      # Build

      - name: Build
        run: cmake --build build --parallel

      # Test

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # Visual Studio toolset, separate from the MinGW job above.
  # Fortran is not installed; golden Fortran is text-only, and the
  # numeric Fortran run skips. continue-on-error stays off so a real
  # MSVC failure is visible. cl must be on PATH at test time because
  # the fbar numeric test compiles generated C itself.
  msvc:
    name: MSVC
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -A x64 -DSDFAST_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: cmd
        run: ctest --test-dir build -C Release --output-on-failure
